<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>开口 90 天 · 界面原型</title>
<style>
:root{
  --bg:#faf9f5; --panel:#ffffff; --hover:#f0eee6; --sel:#ebe9e0;
  --ink:#1f1e1d; --ink2:#6b6a66; --ink3:#a3a19a; --line:#e6e3d9;
  --accent:#c6613f; --accent-soft:#f6e9e3; --ok:#5b8a61; --warn:#b98a2a; --bad:#b9533f;
  --serif:"Songti SC","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
svg{flex:none}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}

/* sidebar */
.side{border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}
.brand{font-family:var(--serif);font-size:20px;font-weight:600;padding:4px 10px 18px;letter-spacing:.01em}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;color:var(--ink);text-align:left}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--sel)}
.nav svg{width:17px;height:17px;color:var(--ink2)}
.nav .sep{font-size:12px;color:var(--ink2);padding:18px 10px 6px}
.side-foot{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border-top:1px solid var(--line);font-size:13px}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--sel);display:grid;place-items:center;font-size:12px}

/* main */
.main{padding:40px 48px 80px;max-width:1080px;width:100%;margin:0 auto}
.narrow{max-width:760px;margin:0 auto}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px}
h1{font-family:var(--serif);font-size:28px;font-weight:600;letter-spacing:.01em}
h2{font-family:var(--serif);font-size:20px;font-weight:600}
.sub{color:var(--ink2);margin-top:6px}
.sec{margin-top:36px}
.sec-t{font-size:13px;color:var(--ink2);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.muted{color:var(--ink2)} .faint{color:var(--ink3);font-size:13px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.hide{display:none!important}
hr{border:none;border-top:1px solid var(--line);margin:28px 0}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:8px;font-weight:500;background:var(--ink);color:#fff}
.btn:hover{background:#3a3936}
.btn.accent{background:var(--accent)} .btn.accent:hover{background:#b3553a}
.btn.line{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--hover)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn svg{width:15px;height:15px}
.link{color:var(--ink2);font-size:13px;display:inline-flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px}
.link:hover{background:var(--hover);color:var(--ink)}
.link svg{width:14px;height:14px}

/* list rows */
.list{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:16px;padding:14px 4px;border-bottom:1px solid var(--line)}
.li:hover{background:rgba(0,0,0,.015)}
.li .t{flex:1;min-width:0}
.li .t b{font-weight:500}
.st{font-size:13px;color:var(--ink2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink3)}
.st.ok::before{background:var(--ok)} .st.go::before{background:var(--accent)} .st.lock{color:var(--ink3)}
.num{width:22px;color:var(--ink3);font-size:13px;font-variant-numeric:tabular-nums}

.bar{height:4px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.bar.a i{background:var(--accent)}

.seg{display:inline-flex;background:var(--hover);border-radius:8px;padding:2px}
.seg button{padding:4px 10px;font-size:13px;border-radius:6px;color:var(--ink2)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 0 0 1px var(--line)}

/* today */
.today-meta{display:flex;align-items:center;gap:18px;margin-top:18px}
.today-meta .bar{flex:1;max-width:320px}

/* chat */
.chat-page{display:grid;grid-template-columns:1fr 280px;gap:28px;min-height:calc(100vh - 120px)}
.chat-col{display:flex;flex-direction:column;max-width:720px;width:100%;margin:0 auto}
.chat-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px}
.chat-head .ttl{font-size:15px;display:flex;align-items:center;gap:6px}
.msgs{flex:1;display:flex;flex-direction:column;gap:22px;padding:20px 0 30px}
.ai{font-family:var(--serif);font-size:16.5px;line-height:1.75}
.ai .who{font-family:var(--sans);font-size:12px;color:var(--ink3);margin-bottom:2px}
.ai .tools{font-family:var(--sans);display:flex;gap:4px;margin-top:4px;margin-left:-6px}
.ai .zh{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-top:2px}
.me{align-self:flex-end;max-width:75%}
.me .bub{background:var(--sel);padding:10px 14px;border-radius:12px;font-size:15px}
.me .tools{text-align:right;margin-top:2px}
.aside-note{font-family:var(--sans);font-size:14px;color:var(--ink2);border-left:2px solid var(--accent);padding:2px 0 2px 12px}
.composer{position:sticky;bottom:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 12px 10px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.composer input{width:100%;border:none;outline:none;font:inherit;font-size:15px;background:transparent;padding:4px 0 10px}
.composer .bar2{display:flex;align-items:center;justify-content:space-between}
.micbtn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--ink2)}
.micbtn:hover{background:var(--hover)}
.micbtn svg{width:18px;height:18px}
.micbtn.rec{background:var(--accent);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(198,97,63,.4)}100%{box-shadow:0 0 0 10px rgba(198,97,63,0)}}
.send{width:32px;height:32px;border-radius:8px;background:var(--accent);color:#fff;display:grid;place-items:center}
.send svg{width:16px;height:16px}

.panel{border:1px solid var(--line);border-radius:12px;background:var(--panel);align-self:start;position:sticky;top:24px}
.panel details{border-bottom:1px solid var(--line)}
.panel details:last-child{border-bottom:none}
.panel summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.panel summary::-webkit-details-marker{display:none}
.panel summary .chev{transition:transform .2s;color:var(--ink3)}
.panel details[open] summary .chev{transform:rotate(90deg)}
.panel .pb{padding:0 14px 14px;font-size:13.5px}
.chk{display:flex;gap:10px;padding:5px 0;align-items:flex-start}
.cb{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink3);flex:none;margin-top:3px;display:grid;place-items:center;font-size:11px;color:#fff}
.cb.on{background:var(--ok);border-color:var(--ok)}
.cb.on::after{content:"✓"}
.chk.on span{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.hintline{padding:6px 0;border-top:1px dashed var(--line)}
.hintline:first-child{border-top:none}
.hintline details summary{padding:2px 0;font-weight:400;color:var(--ink2);font-size:12.5px}

/* modal */
.mask{position:fixed;inset:0;background:rgba(31,30,29,.3);display:grid;place-items:center;z-index:20}
.modal{background:var(--bg);border:1px solid var(--line);border-radius:16px;width:640px;max-width:92vw;max-height:88vh;overflow:auto;padding:28px 30px}
.fix{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:16px;align-items:center}
.fix .o{color:var(--ink2);text-decoration:line-through;text-decoration-color:var(--ink3)}
.fix .n{font-family:var(--serif);font-size:16px;margin-top:2px}

/* flashcard */
.fc-wrap{perspective:1400px;max-width:600px;margin:0 auto}
.fc{height:280px;position:relative;transform-style:preserve-3d;transition:transform .55s;cursor:pointer}
.fc.flipped{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center}
.fc .back{transform:rotateY(180deg)}
.fc .big{font-family:var(--serif);font-size:26px;margin:12px 0 8px;line-height:1.5}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.rate button{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel);text-align:center}
.rate button:hover{background:var(--hover)}
.rate small{display:block;color:var(--ink3);font-size:12px}

/* shadow */
.sent{font-family:var(--serif);font-size:26px;line-height:1.7;margin:22px 0 4px}
.w-ok{color:var(--ink)} .w-mid{color:var(--warn);text-decoration:underline dotted;text-underline-offset:5px} .w-bad{color:var(--bad);text-decoration:line-through}
.wave{display:flex;align-items:center;gap:3px;height:40px;margin:24px 0}
.wave i{width:3px;border-radius:2px;background:var(--line)}
.wave i.p{background:var(--ink2)}
.two{display:grid;grid-template-columns:1.4fr 1fr;gap:48px}

/* mono */
.timer{font-family:var(--serif);font-size:64px;text-align:center;font-variant-numeric:tabular-nums;margin:18px 0 0}
.rewrite p{font-size:15px;line-height:1.85;margin:6px 0 18px}
.rewrite .serif{font-family:var(--serif);font-size:16.5px}
mark{background:var(--accent-soft);color:inherit;padding:0 2px;border-radius:3px}

/* plan */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.phases .cur b{color:var(--accent)}
.cal{display:grid;grid-template-columns:repeat(15,1fr);gap:5px}
.cal div{aspect-ratio:1;border-radius:4px;background:var(--hover);font-size:10px;display:grid;place-items:center;color:var(--ink3)}
.cal .l1{background:#ecd9cf}.cal .l2{background:#dca58f;color:#fff}.cal .l3{background:var(--accent);color:#fff}
.cal .today{box-shadow:0 0 0 1.5px var(--ink)}
.weeks{display:grid;grid-template-columns:1fr 1fr;column-gap:40px}

/* table */
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--ink3);font-weight:500}
.filters{display:flex;gap:10px;margin-bottom:12px;align-items:center;flex-wrap:wrap}
input.in,select.in{border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:var(--panel);color:var(--ink)}

/* progress */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.kpis>div{padding:18px 16px;border-right:1px solid var(--line)}
.kpis>div:last-child{border-right:none}
.kpis b{font-family:var(--serif);font-size:28px;font-weight:600;display:block;line-height:1.2}
.kpis span{font-size:13px;color:var(--ink2)}
.kpis .bar{margin:10px 0 4px}
.chart{width:100%;height:190px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{font-size:13px;padding:5px 11px;border-radius:20px;border:1px solid var(--line);background:var(--panel)}
.badge.lock{color:var(--ink3);background:transparent;border-style:dashed}

/* settings */
.set-group{margin-bottom:34px}
.set-group h3{font-size:15px;font-weight:600;margin-bottom:4px}
.field{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);gap:16px}
.field .d{font-size:13px;color:var(--ink2)}
.sw{width:36px;height:20px;border-radius:12px;background:var(--ink);position:relative;flex:none}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff}
.proto-note{position:fixed;right:16px;bottom:12px;color:var(--ink3);font-size:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">开口 90 天</div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="avatar">U</div><div style="flex:1">Utopia<div class="faint" style="font-size:12px">第 17 天 / 90</div></div></div>
  </aside>
  <main class="main" id="main"></main>
</div>
<div class="proto-note">界面原型 · 数据为示例</div>

<script>
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="6" width="14" height="13" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v11"/></svg>',
  wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 10v4"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  note:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4l13 8-13 8z"/></svg>',
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 7h4l10 10h4M3 17h4l3-3M14 10l3-3h4M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
  sync:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M20 12a8 8 0 0 1-14 5M4 12a8 8 0 0 1 14-5M18 3v4h-4M6 21v-4h4"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  chev:'<svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M15 6l-6 6 6 6"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>',
};
const NAV = [
  ['today','今日',I.home],
  ['sep','练习'],
  ['roleplay','AI 对话',I.chat],['cards','表达卡',I.card],['shadow','跟读',I.wave],['mono','独白',I.mic],
  ['sep','记录'],
  ['plan','学习计划',I.cal],['notes','笔记本',I.note],['progress','进度',I.chart],
  ['sep',''],
  ['settings','设置',I.gear],
];
const MOD = {cards:'表达卡复习',roleplay:'AI 情景对话',shadow:'影子跟读',mono:'话题独白',review:'今日收尾'};
let state = {page:'today', swapped:false, rpView:'list'};

function renderNav(){
  document.getElementById('nav').innerHTML = NAV.map(n=> n[0]==='sep'
    ? `<div class="sep">${n[1]}</div>`
    : `<button class="${state.page===n[0]?'on':''}" onclick="go('${n[0]}')">${n[2]}${n[1]}</button>`).join('');
}
function go(p){state.page=p; if(p==='roleplay') state.rpView='list'; renderNav(); render(); window.scrollTo(0,0)}
function head(t,s,right=''){return `<div class="head"><div><h1>${t}</h1>${s?`<p class="sub">${s}</p>`:''}</div><div class="row">${right}</div></div>`}
function stTxt(s){return {done:'<span class="st ok">已完成</span>',doing:'<span class="st go">进行中</span>',todo:'<span class="st">未开始</span>'}[s]}

/* ---------- 今日 ---------- */
function today(){
  const B = state.swapped ? 'mono' : 'shadow';
  const tasks = [
    {k:'热身',t:'5 分钟',m:'cards',d:'12 张到期卡',s:'done'},
    {k:'随机',t:'10 分钟',m:'roleplay',d:'咖啡店点单',s:'doing'},
    {k:'随机',t:'10 分钟',m:B,d:B==='mono'?'你最近的一个周末':'Ordering at a café',s:'todo',swap:1},
    {k:'收尾',t:'5 分钟',m:'review',d:'错句回顾，存入笔记',s:'todo'},
  ];
  return `<div class="narrow">
   <h1>早上好，Utopia</h1>
   <p class="sub">第 3 周 · 吃饭点餐</p>
   <div class="today-meta"><span>第 <b>17</b> 天 / 90</span><div class="bar a"><i style="width:30%"></i></div><span class="faint">今日 9 / 30 分钟</span></div>
   <div class="sec"><div class="sec-t"><span>今日练习 · 中间两项随机抽取</span>
     <button class="link" onclick="swapTask()" ${state.swapped?'disabled style="opacity:.5"':''}>${I.shuffle}${state.swapped?'今日已换过':'换一个'}</button></div>
   <div class="list">${tasks.map((t,i)=>`
     <div class="li" style="cursor:pointer" onclick="go('${t.m==='review'?'notes':t.m}')" id="task${i}">
       <span class="num">${i+1}</span>
       <div class="t"><b>${MOD[t.m]}</b> <span class="faint">· ${t.d}</span></div>
       <span class="faint" style="width:96px;white-space:nowrap">${t.k} ${t.t}</span>
       <span style="width:70px">${stTxt(t.s)}</span></div>`).join('')}</div></div>
   <div style="margin-top:28px"><button class="btn accent" onclick="openChat()">${I.play}继续今日练习</button></div>
  </div>`;
}
function swapTask(){ if(state.swapped) return; state.swapped=true; render(); const t=document.getElementById('task2'); t.animate([{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'none'}],{duration:400}); }

/* ---------- AI 对话 ---------- */
const SCENES=[
  [1,'认识新朋友','派对上的陌生人',2],[2,'周末聊什么','同事 Mia',2],[3,'咖啡店点单','咖啡师 Sam',1],
  [3,'餐厅点菜与结账','服务员 Leo',0],[4,'买衣服换尺码','店员 Ana',-1],[5,'问路去地铁站','路人 Tom',-1],
];
function roleplay(){
  if(state.rpView==='chat') return chatView();
  const sm={2:'<span class="st ok">已通关</span>',1:'<span class="st go">练习中</span>',0:'<span class="st">可练</span>','-1':'<span class="st lock">未解锁</span>'};
  return `<div class="narrow">`+head('AI 情景对话','AI 扮演角色，你用英语完成任务。对话中不打断纠错，结束后统一复盘。')+
  `<div class="list">${SCENES.map(s=>`<div class="li" style="${s[3]<0?'opacity:.55':'cursor:pointer'}" ${s[3]>=0?'onclick="openChat()"':''}>
     <span class="faint" style="width:48px">第 ${s[0]} 周</span>
     <div class="t"><b>${s[1]}</b><div class="faint">AI 角色：${s[2]} · 基础版 / 进阶版</div></div>
     ${sm[s[3]]}</div>`).join('')}</div>

  return `<div class="narrow">`+head('设置','所有练习能力都在本机运行，断网也能用。')+
  `<div class="set-group"><div class="row between"><h3>本地模型与服务</h3><button class="link">一键检测</button></div>
      ${svc.map(s=>`<div class="field"><div><div>${s[0]}</div><div class="d">${s[1]}</div></div><div class="row"><span class="st ok">已就绪</span><button class="link">更换</button></div></div>`).join('')}
      <p class="faint" style="margin-top:8px">跟读评分为练习参考，非专业发音测评。</p></div>
    <div class="set-group"><h3>Notion 同步</h3>
      <div class="field"><div><div>Integration Token</div><div class="d">在 Notion 设置 → 集成 中创建</div></div><input class="in" type="password" value="secret_xxxxxxxx" style="width:200px"></div>
      <div class="field"><div><div>笔记数据库</div><div class="d">口语笔记 · 128 条</div></div><button class="link">重新选择</button></div>
      <div class="field"><div><div>练习记录数据库</div><div class="d">每日练习记录 · 16 条</div></div><button class="link">重新选择</button></div>
      <div class="field"><div><div>练完自动同步</div><div class="d">断网时排队，联网后补同步</div></div><span class="sw"></span></div></div>
    <div class="set-group"><h3>学习</h3>
      <div class="field"><div>每日时长</div><select class="in"><option>20 分钟</option><option selected>30 分钟</option><option>45 分钟</option></select></div>
      <div class="field"><div>练习日</div><span class="muted">周一至周六 · 周日轻复习</span></div>
      <div class="field"><div>每日提醒</div><input class="in" type="time" value="21:00"></div>
      <div class="field"><div><div>内置内容审核</div><div class="d">AI 生成的内容包需你审核后启用</div></div><span class="st go">第 4 周待审核</span></div></div>
    <div class="set-group"><h3>声音与麦克风</h3>
      <div class="field"><div>口音</div><div class="seg"><button class="on" onclick="seg(this)">美音</button><button onclick="seg(this)">英音</button></div></div>
      <div class="field"><div>声音</div><div class="seg"><button class="on" onclick="seg(this)">女声</button><button onclick="seg(this)">男声</button></div></div>
      <div class="field"><div>默认语速</div><div class="seg"><button onclick="seg(this)">0.75x</button><button class="on" onclick="seg(this)">1.0x</button></div></div>
      <div class="field"><div>麦克风</div><div class="row"><select class="in"><option>MacBook Pro 麦克风</option></select><button class="link">测试</button></div></div></div>
    <div class="set-group"><h3>数据</h3>
      <div class="field"><div>导出 / 导入</div><div class="row"><button class="link">导出 JSON</button><button class="link">导入</button></div></div>
      <div class="field"><div><div>卸载</div><div class="d">运行卸载脚本清除本地全部内容，Notion 数据保留</div></div><button class="link" style="color:var(--bad)">查看卸载说明</button></div></div>
  </div>`;
}

function render(){
  const m={today,roleplay,cards,shadow,mono,plan,notes,progress,settings};
  document.getElementById('main').innerHTML=m[state.page]();
}
renderNav();render();
</script>
